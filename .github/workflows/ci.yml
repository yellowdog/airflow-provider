name: CI

on:
  push:
    branches: [next-version]
  pull_request:
    branches: [main, next-version]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
      - run: uv pip install -e '.[dev]'
      - run: make lint

  typecheck:
    name: typecheck (py${{ matrix.python }}, airflow ${{ matrix.airflow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Type-check at both ends of the supported range, installed as in the
        # test job (min also pins the yellowdog-sdk floor).
        include:
          - { python: "3.12", airflow: "min" }
          - { python: "3.14", airflow: "max" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
      - name: Resolve Airflow version
        id: airflow
        env:
          LABEL: ${{ matrix.airflow }}
        run: |
          V=$(python bin/airflow_versions.py "${LABEL}")
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          if [ "${LABEL}" = "min" ]; then
            SDK=$(python bin/airflow_versions.py sdk-min)
            echo "sdk_pin=yellowdog-sdk==${SDK}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install with Airflow constraints
        env:
          AIRFLOW_VERSION: ${{ steps.airflow.outputs.version }}
          PY: ${{ matrix.python }}
          SDK_PIN: ${{ steps.airflow.outputs.sdk_pin }}
        run: |
          pkgs=("apache-airflow==${AIRFLOW_VERSION}" -e '.[dev]')
          if [ -n "${SDK_PIN}" ]; then pkgs+=("${SDK_PIN}"); fi
          uv pip install "${pkgs[@]}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PY}.txt"
      - run: make typecheck

  test:
    name: test (py${{ matrix.python }}, airflow ${{ matrix.airflow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # min/max are resolved by bin/airflow_versions.py: min is the
        # apache-airflow floor in pyproject.toml, max the latest on PyPI.
        include:
          - { python: "3.12", airflow: "min" }
          - { python: "3.13", airflow: "min" }
          - { python: "3.12", airflow: "max" }
          - { python: "3.14", airflow: "max" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
          enable-cache: true
      - name: Resolve Airflow version
        id: airflow
        env:
          LABEL: ${{ matrix.airflow }}
        run: |
          V=$(python bin/airflow_versions.py "${LABEL}")
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          SDK_TEXT="latest allowed by the constraints"
          # Minimum-Airflow rows also test the declared yellowdog-sdk floor.
          if [ "${LABEL}" = "min" ]; then
            SDK=$(python bin/airflow_versions.py sdk-min)
            echo "sdk_pin=yellowdog-sdk==${SDK}" >> "$GITHUB_OUTPUT"
            SDK_TEXT="yellowdog-sdk==${SDK}"
          fi
          echo "Airflow ${LABEL}: apache-airflow==${V}; yellowdog-sdk: ${SDK_TEXT}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install with Airflow constraints
        env:
          AIRFLOW_VERSION: ${{ steps.airflow.outputs.version }}
          PY: ${{ matrix.python }}
          SDK_PIN: ${{ steps.airflow.outputs.sdk_pin }}
        run: |
          pkgs=("apache-airflow==${AIRFLOW_VERSION}" -e '.[dev]')
          if [ -n "${SDK_PIN}" ]; then pkgs+=("${SDK_PIN}"); fi
          uv pip install "${pkgs[@]}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PY}.txt"
      - run: make test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
      - run: uv pip install -e '.[dev]'
      - run: make docs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
      - run: uv pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python -m zipfile -l dist/*.whl | grep -q py.typed
